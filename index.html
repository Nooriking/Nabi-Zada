<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafafa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="خیام نبی زاده — ارتباط، اعتماد، همراهی" />
    <title>خیام نبی زاده</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-2: #f4f4f5;
        --text: #18181b;
        --text-2: #52525b;
        --text-3: #a1a1aa;
        --border: #e4e4e7;
        --border-strong: #d4d4d8;
        --accent: #18181b;
        --wa: #25d366;
        --fb: #1877f2;
        --yt: #ff0000;
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 10px;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family:
          "Vazirmatn",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .app {
        width: 100%;
        max-width: 440px;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: calc(24px + var(--safe-t)) 20px calc(20px + var(--safe-b));
      }

      /* ===== Reveal ===== */
      .r {
        opacity: 0;
        transform: translateY(8px);
        animation: up 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .r1 {
        animation-delay: 0.04s;
      }
      .r2 {
        animation-delay: 0.1s;
      }
      .r3 {
        animation-delay: 0.16s;
      }
      .r4 {
        animation-delay: 0.22s;
      }
      .r5 {
        animation-delay: 0.28s;
      }
      .r6 {
        animation-delay: 0.34s;
      }
      @keyframes up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== Hero ===== */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 8px 0 0;
      }

      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        overflow: hidden;
        border: 1px solid var(--border-strong);
        background: var(--surface-2);
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.3;
        color: var(--text);
      }
      .en {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      .quote {
        margin-top: 14px;
        font-size: 13px;
        color: var(--text-2);
        line-height: 1.6;
      }

      /* ===== Actions ===== */
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 24px;
      }
      .btn {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: var(--radius-md);
        font:
          600 14px "Vazirmatn",
          sans-serif;
        border: 1px solid transparent;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.1s ease;
        text-decoration: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn i {
        font-size: 13px;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: #2a2a2a;
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--text);
        border-color: var(--border-strong);
      }
      .btn-secondary:hover {
        background: var(--surface-2);
        border-color: var(--text-3);
      }
      .btn-secondary.saved {
        background: #f0fdf4;
        border-color: var(--wa);
        color: #15803d;
      }

      .phone {
        margin-top: 12px;
        text-align: center;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: var(--text-3);
        direction: ltr;
      }

      /* ===== Section label ===== */
      .label {
        margin: 28px 0 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-3);
        padding-inline-start: 2px;
      }

      /* ===== Contact cards ===== */
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .tile {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        text-decoration: none;
        color: inherit;
        transition:
          border-color 0.15s ease,
          transform 0.1s ease;
        min-width: 0;
      }
      .tile:hover {
        border-color: var(--border-strong);
      }
      .tile:active {
        transform: scale(0.98);
      }
      .tile .ic {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 16px;
        color: #fff;
      }
      .tile .info {
        min-width: 0;
        flex: 1;
      }
      .tile strong {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 2px;
      }
      .tile small {
        display: block;
        font-size: 11px;
        color: var(--text-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tile small.ltr {
        direction: ltr;
        text-align: left;
      }

      /* ===== Social list ===== */
      .list {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 16px;
        text-decoration: none;
        color: inherit;
        transition: background 0.15s ease;
        position: relative;
      }
      .row + .row {
        border-top: 1px solid var(--border);
      }
      .row:hover {
        background: var(--surface-2);
      }
      .row:active {
        background: var(--surface-2);
      }
      .row .ic {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 15px;
        color: #fff;
      }
      .row .info {
        flex: 1;
        min-width: 0;
      }
      .row strong {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
      }
      .row small {
        display: block;
        margin-top: 1px;
        font-size: 11.5px;
        color: var(--text-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: ltr;
        text-align: left;
      }
      .row .chev {
        color: var(--text-3);
        font-size: 10px;
        flex-shrink: 0;
        transition:
          transform 0.15s ease,
          color 0.15s ease;
      }
      .row:hover .chev {
        color: var(--text);
        transform: translateX(-2px);
      }

      /* ===== Brand colors (minimal) ===== */
      .ic.wa {
        background: var(--wa);
      }
      .ic.fb {
        background: var(--fb);
      }
      .ic.yt {
        background: var(--yt);
      }
      .ic.ig {
        background: linear-gradient(
          135deg,
          #f09433 0%,
          #e6683c 25%,
          #dc2743 50%,
          #cc2366 75%,
          #bc1888 100%
        );
      }
      .ic.tt {
        background: #000;
      }
      .ic.tt i {
        text-shadow:
          1px 0 0 #25f4ee,
          -1px 0 0 #fe2c55;
      }
      .ic.em {
        background: var(--accent);
      }

      /* ===== Footer ===== */
      footer {
        margin-top: auto;
        padding-top: 28px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--text-3);
      }

      /* ===== Responsive ===== */
      @media (max-width: 360px) {
        .app {
          padding-inline: 16px;
        }
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }

      @media (max-height: 700px) {
        .avatar {
          width: 80px;
          height: 80px;
          margin-bottom: 12px;
        }
        .quote {
          display: none;
        }
        .label {
          margin-top: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <!-- Hero -->
      <header class="hero r r1">
        <div class="avatar">
          <img src="347A4321.JPG.webp" alt="خیام نبی زاده" />
        </div>
        <h1>خیام نبی زاده</h1>
        <p class="en">Khiam Nabizada</p>
        <p class="quote">ارتباط، اعتماد، همراهی.</p>
      </header>

      <!-- Actions -->
      <div class="actions r r2">
        <a class="btn btn-primary" href="tel:+93786131213">

          <span>تماس</span>
        </a>
        <button type="button" id="saveContactBtn" class="btn btn-secondary">

      <!-- Contact -->
      <p class="label r r3">اطلاعات تماس</p>
      <div class="grid-2 r r4">
        <a class="tile" href="mailto:tdp.ahmadkhiam@gmail.com">
          <div class="ic em"><i class="fa-solid fa-envelope"></i></div>
          <div class="info">
            <strong>ایمیل</strong>
            <small class="ltr">tdp.ahmadkhiam@gmail.com</small>
          </div>
        </a>
        <a
          class="tile"
          href="https://wa.me/93786131213"
          target="_blank"

          </div>

      </div>

      <!-- Social -->
      <p class="label r r5">شبکه‌های اجتماعی</p>
      <div class="list r r5">
        <!-- اینستاگرام — لینک جدید -->
        <a
          class="row"
          href="https://www.instagram.com/khiam.nabizada?cplk=OXFibWo2OHJ4N25q"
          target="_blank"
          rel="noopener"
        >
          <div class="ic ig"><i class="fa-brands fa-instagram"></i></div>
          <div class="info">
            <strong>اینستاگرام</strong>

          </div>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
        <!-- فیسبوک — لینک جدید -->
        <a
          class="row"
          href="https://www.facebook.com/share/1F5c24CMaH/"
          target="_blank"
          rel="noopener"
        >
          <div class="ic fb"><i class="fa-brands fa-facebook-f"></i></div>
          <div class="info">
            <strong>فیسبوک</strong>
            <small>Ahmad Khiam Nabizada</small>
          </div>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
        <a
          class="row"
          href="https://www.tiktok.com/@khiam.nabizada?_r=1&_t=ZP-9BEXMGjxGSV"
          target="_blank"
          rel="noopener"
        >
          <div class="ic tt"><i class="fa-brands fa-tiktok"></i></div>
          <div class="info">
            <strong>تیک‌تاک</strong>
            <small>@khiam.nabizada</small>
          </div>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
        <a
          class="row"
          href="https://youtube.com/@laughstore?si=yanjar9bNgd7PKH2"
          target="_blank"
          rel="noopener"
        >
          <div class="ic yt"><i class="fa-brands fa-youtube"></i></div>
          <div class="info">
            <strong>یوتیوب</strong>
            <small>@laughstore</small>
          </div>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
      </div>

      <footer class="r r6">
        <p dir="ltr">© 2026 · Khiam Nabizada</p>
      </footer>
    </main>

    <script>
      const CONTACT = {
        firstName: "Khiam",
        lastName: "Nabizada",
        fullName: "Khiam Nabizada",
        phone: "+93786131213",
        email: "tdp.ahmadkhiam@gmail.com",
        // اینستاگرام — لینک تمیز برای vCard
        instagram: "https://www.instagram.com/khiam.nabizada",
        // فیسبوک — لینک جدید
        facebook: "https://www.facebook.com/share/1F5c24CMaH/",
        youtube: "https://youtube.com/@laughstore",
        whatsapp: "https://wa.me/93786131213",
        tiktok: "https://www.tiktok.com/@khiam.nabizada",
      };

      function buildVCard() {
        return [
          "BEGIN:VCARD",
          "VERSION:3.0",
          "N:" + CONTACT.lastName + ";" + CONTACT.firstName + ";;;",
          "FN:" + CONTACT.fullName,
          "TEL;TYPE=CELL,VOICE:" + CONTACT.phone,
          "EMAIL;TYPE=INTERNET:" + CONTACT.email,
          "URL:" + CONTACT.instagram,
          "URL:" + CONTACT.facebook,
          "URL:" + CONTACT.tiktok,
          "URL:" + CONTACT.youtube,
          "URL:" + CONTACT.whatsapp,
          "END:VCARD",
        ].join("\r\n");
      }

      async function saveContact() {
        const vcard = buildVCard();
        const fileName = "Khiam-Nabizada.vcf";
        const btn = document.getElementById("saveContactBtn");
        const label = document.getElementById("saveContactLabel");
        const ua = navigator.userAgent || "";
        const isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIOS) {
          const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          window.location.href = url;
          setTimeout(() => URL.revokeObjectURL(url), 15000);
          return;
        }

        const file = new File([vcard], fileName, { type: "text/vcard" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: CONTACT.fullName,
              text: "ذخیره در مخاطبین",
            });
            return;
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }

        const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        if (btn && label) {
          const original = label.textContent;
          btn.classList.add("saved");
          label.textContent = "دانلود شد";
          setTimeout(() => {
            btn.classList.remove("saved");
            label.textContent = original;
          }, 2500);
        }
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }

      document
        .getElementById("saveContactBtn")
        .addEventListener("click", saveContact);
    </script>
  </body>
</html>
