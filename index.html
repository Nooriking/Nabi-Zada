<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a2540" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="description" content="خیام نبی زاده — ارتباط، اعتماد، همراهی" />
    <title>خیام نبی زاده</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a1628;
        --bg2: #0f1f38;
        --card: rgba(255, 255, 255, 0.05);
        --card-hover: rgba(255, 255, 255, 0.09);
        --border: rgba(255, 255, 255, 0.1);
        --accent: #4f9eff;
        --accent2: #6ee7ff;
        --gold: #f5b942;
        --text: #f0f6ff;
        --muted: rgba(240, 246, 255, 0.55);
        --wa: #25d366;
        --fb: #1877f2;
        --yt: #ff0000;
        --radius: 18px;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Vazirmatn", sans-serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        overflow-x: hidden;
      }

      .phone {
        width: 100%;
        max-width: 430px;
        min-height: 100dvh;
        position: relative;
        background:
          radial-gradient(
            ellipse 120% 60% at 50% -10%,
            rgba(79, 158, 255, 0.18),
            transparent 60%
          ),
          radial-gradient(
            ellipse 80% 50% at 80% 110%,
            rgba(110, 231, 255, 0.08),
            transparent 60%
          ),
          var(--bg);
        display: flex;
        flex-direction: column;
        padding: calc(20px + var(--safe-t)) 18px calc(16px + var(--safe-b));
        overflow: hidden;
      }

      /* ===== Animated grid lines background ===== */
      .phone::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(79, 158, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79, 158, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(
          ellipse 80% 60% at 50% 30%,
          black,
          transparent 80%
        );
        -webkit-mask-image: radial-gradient(
          ellipse 80% 60% at 50% 30%,
          black,
          transparent 80%
        );
        pointer-events: none;
        z-index: 0;
      }

      .phone > * {
        position: relative;
        z-index: 1;
      }

      /* ===== Reveal ===== */
      .r {
        opacity: 0;
        transform: translateY(12px);
        animation: up 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .r1 {
        animation-delay: 0.05s;
      }
      .r2 {
        animation-delay: 0.12s;
      }
      .r3 {
        animation-delay: 0.19s;
      }
      .r4 {
        animation-delay: 0.26s;
      }
      .r5 {
        animation-delay: 0.33s;
      }
      .r6 {
        animation-delay: 0.4s;
      }
      @keyframes up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== Hero ===== */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 8px 0 4px;
      }

      .avatar-ring {
        position: relative;
        width: 108px;
        height: 108px;
        margin-bottom: 14px;
      }
      .avatar-ring::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          var(--accent),
          var(--accent2),
          var(--gold),
          var(--accent)
        );
        animation: spin 6s linear infinite;
        z-index: 0;
      }
      .avatar-ring::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        background: var(--bg);
        z-index: 1;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .avatar-ring img {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        border: 3px solid var(--bg);
      }

      h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #fff 30%, var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.3;
      }
      .en {
        margin-top: 4px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .quote {
        margin-top: 12px;
        font-size: 12.5px;
        color: var(--muted);
        padding: 6px 16px;
        border: 1px solid var(--border);
        border-radius: 99px;
        background: var(--card);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      /* ===== Action buttons ===== */
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 20px;
      }
      .btn {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 14px;
        font:
          700 14px "Vazirmatn",
          sans-serif;
        border: none;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease;
        text-decoration: none;
        position: relative;
        overflow: hidden;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--accent), #3d7dd6);
        color: #fff;
        box-shadow: 0 8px 24px -8px rgba(79, 158, 255, 0.6);
      }
      .btn-primary:hover {
        box-shadow: 0 12px 28px -8px rgba(79, 158, 255, 0.8);
      }
      .btn-ghost {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .btn-ghost:hover {
        background: var(--card-hover);
        border-color: rgba(79, 158, 255, 0.4);
      }
      .btn-ghost.saved {
        background: rgba(37, 211, 102, 0.15);
        border-color: var(--wa);
        color: #7dffa8;
      }

      .phone-num {
        margin-top: 10px;
        text-align: center;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.1em;
        color: var(--muted);
        direction: ltr;
      }

      /* ===== Section label ===== */
      .section-label {
        margin: 22px 0 10px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--border), transparent);
      }

      /* ===== Cards grid ===== */
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        text-decoration: none;
        color: inherit;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          border-color 0.2s ease;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 60px;
        height: 60px;
        background: radial-gradient(
          circle,
          rgba(79, 158, 255, 0.15),
          transparent 70%
        );
        pointer-events: none;
      }
      .card:hover {
        transform: translateY(-3px);
        background: var(--card-hover);
        border-color: rgba(79, 158, 255, 0.35);
      }
      .card:active {
        transform: scale(0.98);
      }
      .card .icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 18px;
        color: #fff;
        position: relative;
        z-index: 1;
      }
      .card strong {
        display: block;
        font-size: 13.5px;
        font-weight: 700;
        margin-bottom: 3px;
      }
      .card small {
        display: block;
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: ltr;
        text-align: left;
        font-family: "Vazirmatn", sans-serif;
      }

      /* ===== Social rows ===== */
      .social-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .social {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        text-decoration: none;
        color: inherit;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          border-color 0.2s ease;
      }
      .social:hover {
        transform: translateX(-4px);
        background: var(--card-hover);
        border-color: rgba(79, 158, 255, 0.35);
      }
      .social:active {
        transform: scale(0.98);
      }
      .social .icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 17px;
        color: #fff;
      }
      .social .meta {
        flex: 1;
        min-width: 0;
      }
      .social strong {
        display: block;
        font-size: 13px;
        font-weight: 700;
      }
      .social small {
        display: block;
        margin-top: 2px;
        font-size: 10.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: ltr;
        text-align: left;
      }
      .social .chev {
        color: var(--muted);
        font-size: 11px;
        transition:
          transform 0.2s ease,
          color 0.2s ease;
      }
      .social:hover .chev {
        color: var(--accent);
        transform: translateX(-3px);
      }

      /* ===== Brand colors ===== */
      .em .icon {
        background: linear-gradient(135deg, #4f9eff, #2b5fb3);
        box-shadow: 0 4px 14px -4px rgba(79, 158, 255, 0.5);
      }
      .wa .icon {
        background: linear-gradient(135deg, #25d366, #128c4a);
        box-shadow: 0 4px 14px -4px rgba(37, 211, 102, 0.5);
      }
      .fb .icon {
        background: linear-gradient(135deg, #1877f2, #0e4da8);
        box-shadow: 0 4px 14px -4px rgba(24, 119, 242, 0.5);
      }
      .yt .icon {
        background: linear-gradient(135deg, #ff0000, #b30000);
        box-shadow: 0 4px 14px -4px rgba(255, 0, 0, 0.45);
      }
      .ig .icon {
        background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
        box-shadow: 0 4px 14px -4px rgba(220, 39, 67, 0.5);
      }
      .tt .icon {
        background: #000;
        box-shadow:
          -2px 2px 10px -2px rgba(37, 244, 238, 0.5),
          2px -2px 10px -2px rgba(254, 44, 85, 0.5);
      }
      .tt .icon i {
        text-shadow:
          1.5px 0 0 #25f4ee,
          -1.5px 0 0 #fe2c55;
      }

      /* ===== Footer ===== */
      footer {
        margin-top: auto;
        padding-top: 24px;
        text-align: center;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      @media (max-width: 360px) {
        .cards {
          grid-template-columns: 1fr;
        }
      }

      @media (max-height: 700px) {
        .avatar-ring {
          width: 88px;
          height: 88px;
        }
        h1 {
          font-size: 19px;
        }
        .quote,
        .phone-num {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <!-- Hero -->
      <header class="hero r r1">
        <div class="avatar-ring">
          <img src="347A4321.JPG.webp" alt="خیام نبی زاده" />
        </div>
        <h1>خیام نبی زاده</h1>
        <p class="en">Khiam Nabizada</p>

      <!-- Actions -->
      <div class="actions r r2">

      <!-- Contact -->
      <p class="section-label r r3">اطلاعات تماس</p>
      <div class="cards r r4">

      <!-- Social -->
      <p class="section-label r r5">شبکه‌های اجتماعی</p>
      <div class="social-list r r5">
        <a
          class="social ig"
          href="https://www.instagram.com/khiamnabizada?mdxt=a2lxc25pZWlzNHEw&amp;utm_source=qr"
          target="_blank"

        >
          <div class="icon"><i class="fa-brands fa-instagram"></i></div>
          <div class="meta">
            <strong>اینستاگرام</strong>

          </div>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
        <a
          class="social fb"
          href="https://www.facebook.com/ahmadkhiam.nabizadanabizada?mibextid=wwXIfr"
          target="_blank"
          rel="noopener"
        >
          <div class="icon"><i class="fa-brands fa-facebook-f"></i></div>
          <div class="meta">
            <strong>فیسبوک</strong>
            <small>Ahmad Khiam Nabizada</small>
          </div>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
        <a
          class="social tt"
          href="https://www.tiktok.com/@khiam.nabizada?_r=1&_t=ZP-9BEXMGjxGSV"
          target="_blank"
          rel="noopener"
        >
          <div class="icon"><i class="fa-brands fa-tiktok"></i></div>
          <div class="meta">
            <strong>تیک‌تاک</strong>
            <small>@khiam.nabizada</small>
          </div>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
        <a
          class="social yt"
          href="https://youtube.com/@laughstore?si=yanjar9bNgd7PKH2"
          target="_blank"
          rel="noopener"
        >
          <div class="icon"><i class="fa-brands fa-youtube"></i></div>
          <div class="meta">
            <strong>یوتیوب</strong>
            <small>@laughstore</small>
          </div>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
      </div>

      <footer class="r r6">
        <p dir="ltr">© 2026 · Khiam Nabizada</p>
      </footer>
    </main>

    <script>
      const CONTACT = {
        firstName: "Khiam",
        lastName: "Nabizada",
        fullName: "Khiam Nabizada",
        phone: "+93786131213",
        email: "tdp.ahmadkhiam@gmail.com",
        instagram: "https://www.instagram.com/khiamnabizada",
        facebook: "https://www.facebook.com/ahmadkhiam.nabizadanabizada",
        youtube: "https://youtube.com/@laughstore",
        whatsapp: "https://wa.me/93786131213",
        tiktok: "https://www.tiktok.com/@khiam.nabizada",
      };

      function buildVCard() {
        return [
          "BEGIN:VCARD",
          "VERSION:3.0",
          "N:" + CONTACT.lastName + ";" + CONTACT.firstName + ";;;",
          "FN:" + CONTACT.fullName,
          "TEL;TYPE=CELL,VOICE:" + CONTACT.phone,
          "EMAIL;TYPE=INTERNET:" + CONTACT.email,
          "URL:" + CONTACT.instagram,
          "URL:" + CONTACT.facebook,
          "URL:" + CONTACT.tiktok,
          "URL:" + CONTACT.youtube,
          "URL:" + CONTACT.whatsapp,
          "END:VCARD",
        ].join("\r\n");
      }

      async function saveContact() {
        const vcard = buildVCard();
        const fileName = "Khiam-Nabizada.vcf";
        const btn = document.getElementById("saveContactBtn");
        const label = document.getElementById("saveContactLabel");
        const ua = navigator.userAgent || "";
        const isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIOS) {
          const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          window.location.href = url;
          setTimeout(() => URL.revokeObjectURL(url), 15000);
          return;
        }

        const file = new File([vcard], fileName, { type: "text/vcard" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: CONTACT.fullName,
              text: "ذخیره در مخاطبین",
            });
            return;
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }

        const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        if (btn && label) {
          const original = label.textContent;
          btn.classList.add("saved");
          label.textContent = "دانلود شد ✓";
          setTimeout(() => {
            btn.classList.remove("saved");
            label.textContent = original;
          }, 2500);
        }
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }

      document
        .getElementById("saveContactBtn")
        .addEventListener("click", saveContact);
    </script>
  </body>
</html>
