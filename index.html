<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8f0fe" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="خیام نبی زاده — ارتباط، اعتماد، همراهی" />
    <title>خیام نبی زاده</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0a2540;
        --blue: #1a73e8;
        --sky: #e8f0fe;
        --white: #ffffff;
        --wa: #25d366;
        --fb: #1877f2;
        --yt: #ff0000;
        --text: var(--navy);
        --muted: rgba(10, 37, 64, 0.62);
        --line: rgba(26, 115, 232, 0.22);
        --tap: 50px;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        overscroll-behavior: none;
      }

      body {
        font-family: "Vazirmatn", "Inter", sans-serif;
        color: var(--text);
        background: var(--sky);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        overflow-x: hidden;
      }

      .cursor-dot,
      .cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        border-radius: 50%;
        z-index: 9999;
        transform: translate(-50%, -50%);
        will-change: transform;
        opacity: 0;
        display: none;
      }
      body.custom-cursor .cursor-dot,
      body.custom-cursor .cursor-ring {
        display: block;
        opacity: 1;
      }
      body.custom-cursor,
      body.custom-cursor * {
        cursor: none !important;
      }

      .cursor-dot {
        width: 8px;
        height: 8px;
        background: var(--navy);
        box-shadow: 0 0 12px rgba(26, 115, 232, 0.55);
        transition:
          width 0.18s ease,
          height 0.18s ease,
          background 0.18s ease;
      }
      .cursor-ring {
        width: 34px;
        height: 34px;
        border: 1.5px solid rgba(26, 115, 232, 0.55);
        background: rgba(232, 240, 254, 0.55);
        transition:
          width 0.25s ease,
          height 0.25s ease,
          border-color 0.25s ease,
          background 0.25s ease;
      }
      body.cursor-hover .cursor-dot {
        width: 14px;
        height: 14px;
        background: var(--blue);
      }
      body.cursor-hover .cursor-ring {
        width: 52px;
        height: 52px;
        border-color: var(--navy);
        background: rgba(26, 115, 232, 0.14);
      }

      .orbs {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        animation: floatOrb 14s ease-in-out infinite;
      }
      .orb.o1 {
        width: 220px;
        height: 220px;
        background: radial-gradient(
          circle,
          rgba(26, 115, 232, 0.45),
          transparent 70%
        );
        top: -40px;
        right: -40px;
        opacity: 0.75;
      }
      .orb.o2 {
        width: 200px;
        height: 200px;
        background: radial-gradient(
          circle,
          rgba(10, 37, 64, 0.28),
          transparent 70%
        );
        bottom: 120px;
        left: -60px;
        animation-delay: -4s;
        opacity: 0.7;
      }
      .orb.o3 {
        width: 180px;
        height: 180px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.95),
          transparent 70%
        );
        top: 40%;
        right: -50px;
        animation-delay: -8s;
        opacity: 0.9;
      }
      @keyframes floatOrb {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(-20px, 25px) scale(1.08);
        }
      }

      .phone {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        min-height: 100dvh;
        position: relative;
        overflow: visible;
        background:
          radial-gradient(
            ellipse 90% 45% at 50% -8%,
            rgba(26, 115, 232, 0.16),
            transparent 55%
          ),
          var(--sky);
        display: flex;
        flex-direction: column;
        padding: calc(16px + var(--safe-t)) 16px calc(12px + var(--safe-b));
        z-index: 1;
      }

      .reveal {
        opacity: 0;
        transform: translateY(14px);
        animation: fadeUp 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .reveal.d1 {
        animation-delay: 0.05s;
      }
      .reveal.d2 {
        animation-delay: 0.15s;
      }
      .reveal.d3 {
        animation-delay: 0.25s;
      }
      .reveal.d4 {
        animation-delay: 0.35s;
      }
      .reveal.d5 {
        animation-delay: 0.45s;
      }
      .reveal.d6 {
        animation-delay: 0.55s;
      }
      .reveal.d7 {
        animation-delay: 0.65s;
      }
      .reveal.d8 {
        animation-delay: 0.75s;
      }
      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        width: 96px;
        height: 96px;
        margin: 0 auto 10px;
        border-radius: 22px;
        background: var(--white);
        overflow: hidden;
        border: 2px solid var(--blue);
        box-shadow:
          0 0 0 4px var(--sky),
          0 0 0 6px rgba(26, 115, 232, 0.28),
          0 16px 36px -14px rgba(10, 37, 64, 0.35);
        transition:
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.4s ease;
        position: relative;
      }
      .logo::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          120deg,
          transparent 30%,
          rgba(232, 240, 254, 0.9) 50%,
          transparent 70%
        );
        transform: translateX(-120%);
        transition: transform 0.9s ease;
        pointer-events: none;
      }
      .logo:hover {
        transform: rotate(-6deg) scale(1.05);
        box-shadow:
          0 0 0 4px var(--sky),
          0 0 0 6px rgba(10, 37, 64, 0.45),
          0 22px 46px -14px rgba(10, 37, 64, 0.55);
      }
      .logo:hover::after {
        transform: translateX(120%);
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .brand {
        text-align: center;
      }

      h1 {
        font-size: 18px;
        font-weight: 800;
        line-height: 1.5;
        background: linear-gradient(
          90deg,
          var(--navy) 0%,
          var(--blue) 35%,
          var(--navy) 50%,
          var(--blue) 65%,
          var(--navy) 100%
        );
        background-size: 220% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shineText 6s linear infinite;
      }
      @keyframes shineText {
        to {
          background-position: 220% center;
        }
      }

      .en {
        margin-top: 4px;
        font-family: "Inter", sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--blue);
      }

      .rule {
        width: 36px;
        height: 2px;
        margin: 10px auto 0;
        border-radius: 99px;
        background: var(--blue);
        position: relative;
        overflow: hidden;
      }
      .rule::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          var(--sky),
          transparent
        );
        animation: ruleShine 2.4s ease-in-out infinite;
      }
      @keyframes ruleShine {
        0% {
          transform: translateX(-100%);
        }
        60%,
        100% {
          transform: translateX(100%);
        }
      }

      .quote {
        margin: 10px auto 0;
        max-width: 280px;
        font-size: 13px;
        line-height: 1.9;
        color: var(--muted);
      }

      /* ====== دکمه‌های بالا: فقط 2 دکمه ====== */
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }
      .btn {
        height: var(--tap);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 16px;
        text-decoration: none;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        border: none;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        transition:
          transform 0.2s ease,
          box-shadow 0.3s ease,
          background 0.3s ease;
        cursor: pointer;
      }
      .btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -80%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          100deg,
          transparent,
          rgba(232, 240, 254, 0.65),
          transparent
        );
        transform: skewX(-20deg);
        transition: left 0.7s ease;
        z-index: 1;
      }
      .btn:hover::before {
        left: 130%;
      }
      .btn i {
        font-size: 13px;
        position: relative;
        z-index: 2;
        transition: transform 0.3s ease;
      }
      .btn span {
        position: relative;
        z-index: 2;
      }
      .btn:hover i {
        transform: translateY(-1px) rotate(-8deg) scale(1.15);
      }
      .btn-blue {
        background: var(--blue);
        color: var(--white);
        box-shadow: 0 10px 22px -12px rgba(26, 115, 232, 0.75);
      }
      .btn-blue:hover {
        background: var(--navy);
        box-shadow: 0 14px 28px -10px rgba(10, 37, 64, 0.7);
      }
      .btn:active {
        transform: scale(0.965);
      }

      .btn-save {
        background: var(--navy);
        color: var(--white);
        border: 1px solid var(--navy);
        animation: softPulse 3s ease-in-out infinite;
      }
      .btn-save:hover {
        background: var(--blue);
        border-color: var(--blue);
      }
      @keyframes softPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.4);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(26, 115, 232, 0);
        }
      }
      .btn-save.saved {
        background: #1a9e4a;
        border-color: #1a9e4a;
        animation: none;
      }

      .phone-num {
        margin-top: 10px;
        text-align: center;
        font-family: "Inter", sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--muted);
        direction: ltr;
        transition: color 0.3s ease;
      }
      .phone-num:hover {
        color: var(--navy);
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0 10px;
        font-size: 12px;
        font-weight: 700;
        color: var(--navy);
      }
      .section-title::before,
      .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .link {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        padding: 8px 12px;
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 16px;
        text-decoration: none;
        color: inherit;
        transition:
          transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
          border-color 0.3s ease,
          background 0.3s ease,
          box-shadow 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .link::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          120deg,
          transparent 40%,
          rgba(26, 115, 232, 0.1) 50%,
          transparent 60%
        );
        transform: translateX(-120%);
        transition: transform 0.8s ease;
        pointer-events: none;
      }
      .link:hover::after {
        transform: translateX(120%);
      }
      .link:hover {
        transform: translateY(-3px);
        border-color: var(--navy);
        background: var(--sky);
        box-shadow: 0 14px 26px -16px rgba(10, 37, 64, 0.4);
      }
      .link:active {
        transform: scale(0.985);
      }

      .icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 18px;
        color: var(--white);
        transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .link:hover .icon {
        transform: rotate(-10deg) scale(1.1);
      }

      .ig .icon {
        background: linear-gradient(
          45deg,
          #f09433,
          #e6683c,
          #dc2743,
          #cc2366,
          #bc1888
        );
        box-shadow: 0 4px 12px -4px rgba(220, 39, 67, 0.5);
      }
      .fb .icon {
        background: var(--fb);
        box-shadow: 0 4px 12px -4px rgba(24, 119, 242, 0.5);
      }
      .yt .icon {
        background: var(--yt);
        box-shadow: 0 4px 12px -4px rgba(255, 0, 0, 0.45);
      }
      .wa .icon {
        background: var(--wa);
        box-shadow: 0 4px 12px -4px rgba(37, 211, 102, 0.5);
      }
      .em .icon {
        background: linear-gradient(135deg, var(--blue), var(--navy));
        box-shadow: 0 4px 12px -4px rgba(26, 115, 232, 0.5);
      }

      .meta {
        flex: 1;
        min-width: 0;
      }
      .meta strong {
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: var(--navy);
      }
      .meta small {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .handle {
        font-family: "Inter", sans-serif;
        direction: ltr;
        text-align: left;
        unicode-bidi: isolate;
      }
      /* ایمیل: خط بشکند تا کامل دیده شود */
      .em .meta small {
        white-space: normal;
        word-break: break-all;
        overflow: visible;
        text-overflow: clip;
        font-size: 11px;
      }

      .chev {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--sky);
        color: var(--blue);
        flex-shrink: 0;
        transition:
          transform 0.3s ease,
          background 0.3s ease,
          color 0.3s ease;
      }
      .link:hover .chev {
        transform: translateX(-3px);
        background: var(--navy);
        color: var(--white);
      }
      .chev i {
        font-size: 10px;
      }

      footer {
        margin-top: 16px;
        text-align: center;
      }
      footer p {
        font-family: "Inter", sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      @media (max-height: 700px) {
        .phone {
          padding-top: calc(12px + var(--safe-t));
        }
        .logo {
          width: 88px;
          height: 88px;
          margin-bottom: 8px;
          border-radius: 22px;
        }
        h1 {
          font-size: 16px;
        }
        .quote,
        .phone-num {
          display: none;
        }
        .link {
          min-height: 52px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>

    <script>
      const CONTACT = {
        firstName: "Khiam",
        lastName: "Nabizada",
        fullName: "Khiam Nabizada",
        phone: "+93786131213",
        email: "tdp.ahmadkhiam@gmail.com",
        instagram: "https://www.instagram.com/khiamnabizada",
        facebook: "https://www.facebook.com/ahmadkhiam.nabizadanabizada",
        youtube: "https://youtube.com/@laughstore",
        whatsapp: "https://wa.me/93786131213",
      };

      function buildVCard() {
        return [
          "BEGIN:VCARD",
          "VERSION:3.0",
          "N:" + CONTACT.lastName + ";" + CONTACT.firstName + ";;;",
          "FN:" + CONTACT.fullName,
          "TEL;TYPE=CELL,VOICE:" + CONTACT.phone,
          "EMAIL;TYPE=INTERNET:" + CONTACT.email,
          "URL:" + CONTACT.instagram,
          "URL:" + CONTACT.facebook,
          "URL:" + CONTACT.youtube,
          "URL:" + CONTACT.whatsapp,
          "END:VCARD",
        ].join("\r\n");
      }

      async function saveContact() {
        const vcard = buildVCard();
        const fileName = "Khiam-Nabizada.vcf";
        const btn = document.getElementById("saveContactBtn");
        const label = document.getElementById("saveContactLabel");

        const ua = navigator.userAgent || "";
        const isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIOS) {
          const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          window.location.href = url;
          setTimeout(() => URL.revokeObjectURL(url), 15000);
          return;
        }

        const file = new File([vcard], fileName, { type: "text/vcard" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: CONTACT.fullName,
              text: "ذخیره در مخاطبین / Save to Contacts",
            });
            return;
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }

        const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        if (btn && label) {
          const original = label.textContent;
          btn.classList.add("saved");
          label.textContent = "دانلود شد ✓";
          setTimeout(() => {
            btn.classList.remove("saved");
            label.textContent = original;
          }, 3000);
        }

        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }

      document
        .getElementById("saveContactBtn")
        .addEventListener("click", saveContact);

      (function () {
        const dot = document.getElementById("cursorDot");
        const ring = document.getElementById("cursorRing");

        const isTouch =
          navigator.maxTouchPoints > 0 ||
          "ontouchstart" in window ||
          window.matchMedia("(pointer: coarse)").matches;

        const hasFinePointer = window.matchMedia(
          "(hover: hover) and (pointer: fine)",
        ).matches;

        if (isTouch || !hasFinePointer) {
          dot.style.display = "none";
          ring.style.display = "none";
          return;
        }

        let mx = window.innerWidth / 2;
        let my = window.innerHeight / 2;
        let rx = mx,
          ry = my;

        document.addEventListener("mousemove", function (e) {
          if (!document.body.classList.contains("custom-cursor")) {
            document.body.classList.add("custom-cursor");
          }
          mx = e.clientX;
          my = e.clientY;
          dot.style.transform =
            "translate(" + mx + "px, " + my + "px) translate(-50%, -50%)";
        });

        (function animateRing() {
          rx += (mx - rx) * 0.18;
          ry += (my - ry) * 0.18;
          ring.style.transform =
            "translate(" + rx + "px, " + ry + "px) translate(-50%, -50%)";
          requestAnimationFrame(animateRing);
        })();

        document
          .querySelectorAll("a, button, .btn, .link, .logo")
          .forEach(function (el) {
            el.addEventListener("mouseenter", function () {
              document.body.classList.add("cursor-hover");
            });
            el.addEventListener("mouseleave", function () {
              document.body.classList.remove("cursor-hover");
            });
          });

        document.addEventListener("mouseleave", function () {
          dot.style.opacity = "0";
          ring.style.opacity = "0";
        });
        document.addEventListener("mouseenter", function () {
          dot.style.opacity = "1";
          ring.style.opacity = "1";
        });
      })();
    </script>
  </body>
</html>
